name: ticket-dag-drain
description: |
  Drain implementation Tickets on this Target. Copy the ticket-dag pack
  folder to ~/.archon/workflows/ (copy, not a symlink). Target does not
  commit .archon/.
worktree:
  enabled: false
inputs:
  config:
    default: .scratch/ticket-dag.yaml
    description: Path to YAML with model, thinkingLevel, concurrency
nodes:
  - id: rematch
    script: rematch
    runtime: bun
    always_run: true
    with:
      config: $INPUTS.config
  - id: drain
    depends_on: [rematch]
    loop_group:
      max_iterations: 500
      until_bash: test $pick.output = "[]"
      nodes:
        - id: pick
          script: pick
          runtime: bun
          with:
            config: $INPUTS.config
        - id: execute
          include: ticket-dag-execute
          depends_on: [pick]
          with:
            config: $INPUTS.config
          fan_out:
            # The throttle is config.concurrency: pick prints at most that many Ticket ids, so this
            # launches the batch the pool can take, not everything that is startable.
            items: "$pick.output"
            as: ticket
            join: all_done
  - id: review
    script: review
    runtime: bun
    timeout: 2000000
    depends_on: [drain]
    with:
      config: $INPUTS.config
  - id: summary
    script: summary
    runtime: bun
    timeout: 2000000
    depends_on: [review]
    with:
      config: $INPUTS.config
